<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apogee</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1114;
    --panel: #1B1E23;
    --panel-2: #20242A;
    --border: #2A2E35;
    --text: #ECE9E2;
    --text-dim: #8B9099;
    --text-faint: #5B6069;
    --amber: #E0A458;
    --amber-dim: #E0A45822;
    --green: #7EC699;
    --red: #D9736A;
    --blue: #7BA7BC;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  ::selection{ background: var(--amber-dim); color: var(--amber); }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#33383F; border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px;
    border-bottom:1px solid var(--border);
    background: var(--panel);
    flex-shrink:0;
    gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:22px; height:22px; border-radius:5px;
    background: linear-gradient(135deg, var(--amber), #C97D3B);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand .mark svg{ width:13px; height:13px; }
  .brand h1{ font-size:14px; font-weight:600; letter-spacing:0.2px; }
  .brand .sub{ font-size:11px; color:var(--text-faint); font-family:var(--mono); }

  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .btn{
    font-family:var(--sans); font-size:12.5px; font-weight:600;
    padding:7px 13px; border-radius:7px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:.12s;
  }
  .btn:hover{ border-color:#3A3F47; background:#262A31; }
  .btn.primary{ background: var(--amber); color:#1A1408; border-color:var(--amber); }
  .btn.primary:hover{ background:#EBB271; }
  .btn svg{ width:14px; height:14px; flex-shrink:0; }

  .layout{ flex:1; display:flex; min-height:0; }

  /* left log pane, mirrors Forge's chat pane */
  .log-pane{
    width:290px; min-width:230px; flex-shrink:0;
    display:flex; flex-direction:column;
    border-right:1px solid var(--border);
    background: var(--bg);
  }
  .log-header{
    padding:10px 14px; border-bottom:1px solid var(--border);
    font-family:var(--mono); font-size:11px; color:var(--text-faint);
    letter-spacing:.4px; text-transform:uppercase; flex-shrink:0;
  }
  .log-scroll{ flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .log-entry{ display:flex; gap:9px; }
  .log-icon{
    width:22px; height:22px; border-radius:6px; flex-shrink:0; margin-top:1px;
    display:flex; align-items:center; justify-content:center;
  }
  .log-icon svg{ width:12px; height:12px; }
  .log-icon.launch{ background:#7BA7BC22; color:var(--blue); }
  .log-icon.capture{ background:#7EC69922; color:var(--green); }
  .log-icon.escape{ background:#8B909922; color:var(--text-dim); }
  .log-icon.consumed{ background:#D9736A22; color:var(--red); }
  .log-body{ font-size:12px; line-height:1.5; padding-top:2px; }
  .log-body .t{ font-family:var(--mono); font-size:10px; color:var(--text-faint); display:block; margin-top:1px; }
  .log-empty{ color:var(--text-faint); font-size:12px; padding:14px 6px; line-height:1.6; font-family:var(--mono); }

  .controls{
    border-top:1px solid var(--border); padding:12px 14px; background:var(--panel); flex-shrink:0;
    display:flex; flex-direction:column; gap:12px;
  }
  .ctrl-row{ display:flex; flex-direction:column; gap:5px; }
  .ctrl-row label{
    font-family:var(--mono); font-size:10.5px; color:var(--text-dim);
    display:flex; justify-content:space-between;
  }
  .ctrl-row label b{ color:var(--amber); font-weight:600; }
  input[type=range]{
    -webkit-appearance:none; width:100%; height:3px; border-radius:2px;
    background:var(--border); accent-color:var(--amber); cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--amber); cursor:pointer; border:2px solid #1A1408;
  }
  .ctrl-btns{ display:flex; gap:8px; }
  .ctrl-btns .btn{ flex:1; justify-content:center; padding:8px; font-size:12px; }

  /* main sim area */
  .sim-pane{ flex:1; position:relative; min-width:0; background:var(--bg); overflow:hidden; }
  canvas{ display:block; width:100%; height:100%; cursor:crosshair; }
  .sim-hint{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    font-family:var(--mono); font-size:11px; color:var(--text-faint);
    background:#1B1E23CC; border:1px solid var(--border); padding:6px 12px; border-radius:20px;
    pointer-events:none; backdrop-filter:blur(4px);
    display:flex; align-items:center; gap:6px;
  }
  .sim-hint .dot{ width:5px; height:5px; border-radius:50%; background:var(--amber); }

  .statusbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 16px; border-top:1px solid var(--border); background:var(--panel);
    font-family:var(--mono); font-size:11px; color:var(--text-faint); flex-shrink:0;
  }
  .statusbar .stat{ color:var(--text-dim); }
  .statusbar .stat b{ color:var(--amber); font-weight:600; }
  .status-dot{ width:6px; height:6px; border-radius:50%; background:var(--green); display:inline-block; margin-right:5px; }
  .status-dot.paused{ background:var(--text-faint); }

  @media (max-width: 780px){
    .layout{ flex-direction:column; }
    .log-pane{ width:100%; height:34%; border-right:none; border-bottom:1px solid var(--border); }
    .sim-pane{ height:66%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1A1408" stroke-width="2"><circle cx="12" cy="12" r="2.2" fill="#1A1408" stroke="none"/><ellipse cx="12" cy="12" rx="9" ry="4"/></svg>
    </div>
    <div><h1>Apogee</h1></div>
    <span class="sub">/ gravity sandbox</span>
  </div>
  <div class="topbar-right">
    <button class="btn" id="pauseBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      Pause
    </button>
    <button class="btn primary" id="randomBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
      Scatter orbits
    </button>
  </div>
</div>

<div class="layout">
  <div class="log-pane">
    <div class="log-header">Mission log</div>
    <div class="log-scroll" id="logScroll">
      <div class="log-empty">No activity yet. Drag anywhere in the field to fling a body into orbit.</div>
    </div>
    <div class="controls">
      <div class="ctrl-row">
        <label>Gravity <b id="gVal">1.0x</b></label>
        <input type="range" id="gravity" min="0.2" max="3" step="0.1" value="1">
      </div>
      <div class="ctrl-row">
        <label>Trail length <b id="tVal">70</b></label>
        <input type="range" id="trail" min="10" max="160" step="5" value="70">
      </div>
      <div class="ctrl-row">
        <label>Time scale <b id="sVal">1.0x</b></label>
        <input type="range" id="speed" min="0.2" max="2.5" step="0.1" value="1">
      </div>
      <div class="ctrl-btns">
        <button class="btn" id="clearBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          Clear field
        </button>
      </div>
    </div>
  </div>

  <div class="sim-pane">
    <canvas id="canvas"></canvas>
    <div class="sim-hint" id="simHint"><span class="dot"></span>Click and drag to launch a body</div>
  </div>
</div>

<div class="statusbar">
  <div><span class="status-dot" id="statusDot"></span><span id="statusText">Simulating</span></div>
  <div class="stat"><b id="bodyCount">0</b> bodies &nbsp;·&nbsp; t+<b id="simTime">00:00</b> &nbsp;·&nbsp; <b id="gStat">1.0x</b> gravity</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const logScroll = document.getElementById('logScroll');
const simHint = document.getElementById('simHint');

let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

const COLORS = ['#E0A458', '#7EC699', '#7BA7BC', '#D9736A', '#C99BDA'];
let colorIdx = 0;
function nextColor(){ const c = COLORS[colorIdx % COLORS.length]; colorIdx++; return c; }

const state = {
  gravity: 1,
  trailLen: 70,
  speed: 1,
  paused: false,
  time: 0,
  bodyId: 1,
  bodies: [],
  star: null
};

function initStar(){
  state.star = { x: W/2, y: H/2, r: 16, mass: 26000 };
}

function spawnBody(x, y, vx, vy, opts={}){
  const b = {
    id: state.bodyId++,
    x, y, vx, vy,
    r: opts.r || (3 + Math.random()*2.5),
    color: opts.color || nextColor(),
    trail: [],
    age: 0
  };
  state.bodies.push(b);
  return b;
}

function log(kind, text){
  const empty = logScroll.querySelector('.log-empty');
  if(empty) empty.remove();
  const icons = {
    launch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>',
    capture: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
    escape: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg>',
    consumed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>'
  };
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  const time = new Date(state.time*1000).toISOString().substr(14,5);
  entry.innerHTML = `<div class="log-icon ${kind}">${icons[kind]}</div><div class="log-body">${text}<span class="t">t+${time}</span></div>`;
  logScroll.appendChild(entry);
  logScroll.scrollTop = logScroll.scrollHeight;
  // cap log length
  while(logScroll.children.length > 60) logScroll.removeChild(logScroll.firstChild);
}

function orbitalSpeed(dist){
  const G = 0.9;
  return Math.sqrt(G * state.star.mass * state.gravity / dist) ;
}

function scatterOrbits(){
  for(let i=0;i<5;i++){
    const angle = Math.random()*Math.PI*2;
    const dist = 90 + Math.random()*Math.min(W,H)*0.38;
    const x = state.star.x + Math.cos(angle)*dist;
    const y = state.star.y + Math.sin(angle)*dist;
    const speed = orbitalSpeed(dist) * (0.85 + Math.random()*0.3);
    // tangential direction
    const tx = -Math.sin(angle), ty = Math.cos(angle);
    const dir = Math.random() < 0.5 ? 1 : -1;
    const b = spawnBody(x, y, tx*speed*dir, ty*speed*dir);
    log('launch', `Body <b style="color:${b.color}">#${b.id}</b> scattered into orbit`);
  }
}

function step(dt){
  if(state.paused) return;
  state.time += dt;
  const G = 0.9 * state.gravity;
  for(let i = state.bodies.length - 1; i >= 0; i--){
    const b = state.bodies[i];
    const dx = state.star.x - b.x, dy = state.star.y - b.y;
    const distSq = dx*dx + dy*dy;
    const dist = Math.sqrt(distSq);
    const force = G * state.star.mass / Math.max(distSq, 400);
    const ax = force * dx / dist, ay = force * dy / dist;
    b.vx += ax * dt; b.vy += ay * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.age += dt;

    b.trail.push({x:b.x, y:b.y});
    if(b.trail.length > state.trailLen) b.trail.shift();

    // consumed by star
    if(dist < state.star.r + b.r){
      log('consumed', `Body <b style="color:${b.color}">#${b.id}</b> fell into the star`);
      state.bodies.splice(i,1);
      continue;
    }
    // escaped field
    const margin = 120;
    if(b.x < -margin || b.x > W+margin || b.y < -margin || b.y > H+margin){
      log('escape', `Body <b style="color:${b.color}">#${b.id}</b> escaped the field`);
      state.bodies.splice(i,1);
      continue;
    }
    // stable orbit milestone
    if(!b.loggedStable && b.age > 6){
      b.loggedStable = true;
      log('capture', `Body <b style="color:${b.color}">#${b.id}</b> settled into a stable orbit`);
    }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // starfield background (static-ish, seeded once)
  ctx.fillStyle = '#ffffff10';
  for(let i=0;i<starField.length;i++){
    const s = starField[i];
    ctx.globalAlpha = s.a;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  // star glow
  const grad = ctx.createRadialGradient(state.star.x, state.star.y, 0, state.star.x, state.star.y, 70);
  grad.addColorStop(0, '#E0A458AA');
  grad.addColorStop(1, '#E0A45800');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(state.star.x, state.star.y, 70, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#F4CC8E';
  ctx.beginPath(); ctx.arc(state.star.x, state.star.y, state.star.r, 0, Math.PI*2); ctx.fill();

  // bodies + trails
  state.bodies.forEach(b => {
    for(let i=1;i<b.trail.length;i++){
      const p0 = b.trail[i-1], p1 = b.trail[i];
      ctx.strokeStyle = b.color + hexAlpha(i / b.trail.length * 0.55);
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
    }
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
  });

  // drag line
  if(drag.active){
    ctx.strokeStyle = '#E0A458AA';
    ctx.setLineDash([5,5]);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(drag.x0, drag.y0); ctx.lineTo(drag.x1, drag.y1); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#E0A458';
    ctx.beginPath(); ctx.arc(drag.x0, drag.y0, 3.5, 0, Math.PI*2); ctx.fill();
  }
}

function hexAlpha(a){
  const v = Math.max(0, Math.min(1,a));
  return Math.round(v*255).toString(16).padStart(2,'0');
}

let starField = [];
function buildStarfield(){
  starField = [];
  const count = Math.floor((W*H)/9000);
  for(let i=0;i<count;i++){
    starField.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()<0.85?1:1.6, a: 0.15+Math.random()*0.35 });
  }
}

// drag interaction
const drag = { active:false, x0:0, y0:0, x1:0, y1:0 };
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}
canvas.addEventListener('mousedown', e => {
  const p = getPos(e);
  drag.active = true; drag.x0 = p.x; drag.y0 = p.y; drag.x1 = p.x; drag.y1 = p.y;
  simHint.style.opacity = '0';
});
window.addEventListener('mousemove', e => {
  if(!drag.active) return;
  const p = getPos(e);
  drag.x1 = p.x; drag.y1 = p.y;
});
window.addEventListener('mouseup', e => {
  if(!drag.active) return;
  drag.active = false;
  const dx = drag.x1 - drag.x0, dy = drag.y1 - drag.y0;
  const dist = Math.hypot(dx,dy);
  if(dist > 4){
    const vx = dx * 0.045, vy = dy * 0.045;
    const b = spawnBody(drag.x0, drag.y0, vx, vy);
    log('launch', `Body <b style="color:${b.color}">#${b.id}</b> launched into the field`);
  }
});
canvas.addEventListener('touchstart', e => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mousedown', getTouchInit(e))); }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); window.dispatchEvent(new MouseEvent('mousemove', getTouchInit(e))); }, {passive:false});
canvas.addEventListener('touchend', e => { e.preventDefault(); window.dispatchEvent(new MouseEvent('mouseup', getTouchInit(e))); }, {passive:false});
function getTouchInit(e){
  const t = e.changedTouches[0];
  return { clientX: t.clientX, clientY: t.clientY };
}

// controls
const gravityInput = document.getElementById('gravity');
const trailInput = document.getElementById('trail');
const speedInput = document.getElementById('speed');
gravityInput.addEventListener('input', () => {
  state.gravity = parseFloat(gravityInput.value);
  document.getElementById('gVal').textContent = state.gravity.toFixed(1) + 'x';
  document.getElementById('gStat').textContent = state.gravity.toFixed(1) + 'x';
});
trailInput.addEventListener('input', () => {
  state.trailLen = parseInt(trailInput.value);
  document.getElementById('tVal').textContent = state.trailLen;
});
speedInput.addEventListener('input', () => {
  state.speed = parseFloat(speedInput.value);
  document.getElementById('sVal').textContent = state.speed.toFixed(1) + 'x';
});

document.getElementById('randomBtn').addEventListener('click', scatterOrbits);
document.getElementById('clearBtn').addEventListener('click', () => {
  state.bodies = [];
  logScroll.innerHTML = '<div class="log-empty">Field cleared. Drag anywhere to launch a body.</div>';
});
const pauseBtn = document.getElementById('pauseBtn');
pauseBtn.addEventListener('click', () => {
  state.paused = !state.paused;
  pauseBtn.innerHTML = state.paused
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l16 9-16 9V3z"/></svg> Resume'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Pause';
  document.getElementById('statusDot').classList.toggle('paused', state.paused);
  document.getElementById('statusText').textContent = state.paused ? 'Paused' : 'Simulating';
});

function fmtTime(t){
  const m = Math.floor(t/60).toString().padStart(2,'0');
  const s = Math.floor(t%60).toString().padStart(2,'0');
  return m+':'+s;
}

function updateStatus(){
  document.getElementById('bodyCount').textContent = state.bodies.length;
  document.getElementById('simTime').textContent = fmtTime(state.time);
}

let lastT = performance.now();
function loop(now){
  const dt = Math.min((now - lastT)/1000, 0.05) * state.speed * 40;
  lastT = now;
  step(dt/40);
  draw();
  updateStatus();
  requestAnimationFrame(loop);
}

function boot(){
  resize();
  initStar();
  buildStarfield();
  scatterOrbits();
  requestAnimationFrame(loop);
  setTimeout(() => { simHint.style.transition = 'opacity .6s'; }, 10);
}
window.addEventListener('resize', () => { buildStarfield(); });
boot();
</script>

</body>
</html>
