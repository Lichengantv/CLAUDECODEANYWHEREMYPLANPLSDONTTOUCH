<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161A;
    --panel: #1B1E23;
    --panel-2: #20242A;
    --border: #2A2E35;
    --text: #ECE9E2;
    --text-dim: #8B9099;
    --text-faint: #5B6069;
    --amber: #E0A458;
    --amber-dim: #E0A45822;
    --green: #7EC699;
    --red: #D9736A;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  ::selection{ background: var(--amber-dim); color: var(--amber); }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#33383F; border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* header */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px;
    border-bottom:1px solid var(--border);
    background: var(--panel);
    flex-shrink:0;
    gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:22px; height:22px; border-radius:5px;
    background: linear-gradient(135deg, var(--amber), #C97D3B);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:700; font-size:12px; color:#1A1408;
  }
  .brand h1{ font-size:14px; font-weight:600; letter-spacing:0.2px; }
  .brand .sub{ font-size:11px; color:var(--text-faint); font-family:var(--mono); }

  .proj-name{
    background:transparent; border:1px solid transparent; color:var(--text-dim);
    font-family:var(--mono); font-size:12px; padding:4px 8px; border-radius:6px;
    width:180px; transition:.15s;
  }
  .proj-name:hover, .proj-name:focus{ border-color:var(--border); color:var(--text); outline:none; background:var(--panel-2); }

  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .btn{
    font-family:var(--sans); font-size:12.5px; font-weight:600;
    padding:7px 13px; border-radius:7px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:.12s;
  }
  .btn:hover{ border-color:#3A3F47; background:#262A31; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.primary{
    background: var(--amber); color:#1A1408; border-color:var(--amber);
  }
  .btn.primary:hover{ background:#EBB271; }
  .btn.ghost{ background:transparent; }
  .btn svg{ width:14px; height:14px; flex-shrink:0; }

  /* layout */
  .layout{ flex:1; display:flex; min-height:0; }
  .chat-pane{
    width:38%; min-width:300px; max-width:520px;
    display:flex; flex-direction:column;
    border-right:1px solid var(--border);
    background: var(--bg);
  }
  .code-pane{
    flex:1; display:flex; min-width:0;
  }
  .file-tree{
    width:210px; flex-shrink:0;
    border-right:1px solid var(--border);
    background: var(--panel);
    overflow-y:auto;
    padding:10px 6px;
  }
  .file-tree-empty{
    color:var(--text-faint); font-size:12px; padding:14px 10px; line-height:1.5;
  }
  .tree-node{ font-family:var(--mono); font-size:12.5px; }
  .tree-dir{
    color:var(--text-dim); padding:4px 8px; display:flex; align-items:center; gap:5px;
  }
  .tree-file{
    padding:5px 8px; border-radius:5px; cursor:pointer; color:var(--text-dim);
    display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tree-file:hover{ background:var(--panel-2); color:var(--text); }
  .tree-file.active{ background:var(--amber-dim); color:var(--amber); }
  .tree-file .dot{ width:6px; height:6px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
  .tree-file.active .dot{ background:var(--amber); }
  .tree-file.new .dot{ background:var(--green); animation:pulse 1.6s ease-out 1; }
  .tree-indent{ padding-left:14px; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 #7EC69988; } 100%{ box-shadow:0 0 0 6px #7EC69900; } }

  .viewer{
    flex:1; display:flex; flex-direction:column; min-width:0;
  }
  .viewer-tabs{
    display:flex; border-bottom:1px solid var(--border); background:var(--panel);
    overflow-x:auto; flex-shrink:0;
  }
  .viewer-empty{
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); font-family:var(--mono); font-size:13px; flex-direction:column; gap:10px;
  }
  .viewer-empty svg{ width:34px; height:34px; opacity:.4; }
  .code-scroll{ flex:1; overflow:auto; }
  .code-scroll pre{ margin:0; padding:16px 18px; font-size:12.5px; line-height:1.6; }
  .code-scroll code.hljs{ background:transparent !important; font-family:var(--mono); }
  .filepath-bar{
    font-family:var(--mono); font-size:11.5px; color:var(--text-faint);
    padding:6px 16px; border-bottom:1px solid var(--border); background:var(--panel);
    display:flex; justify-content:space-between; align-items:center; flex-shrink:0;
  }
  .filepath-bar .copy-btn{ cursor:pointer; color:var(--text-dim); background:none; border:none; font-family:var(--sans); font-size:11px; }
  .filepath-bar .copy-btn:hover{ color:var(--amber); }

  /* chat */
  .chat-scroll{ flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:14px; }
  .msg{ display:flex; gap:10px; max-width:100%; }
  .msg-avatar{
    width:24px; height:24px; border-radius:6px; flex-shrink:0; margin-top:2px;
    display:flex; align-items:center; justify-content:center; font-size:10px; font-family:var(--mono); font-weight:700;
  }
  .msg.user .msg-avatar{ background:#2A2E35; color:var(--text-dim); }
  .msg.assistant .msg-avatar{ background:linear-gradient(135deg, var(--amber), #C97D3B); color:#1A1408; }
  .msg-body{ font-size:13px; line-height:1.55; color:var(--text); padding-top:2px; }
  .msg-body p{ margin-bottom:8px; }
  .msg-body p:last-child{ margin-bottom:0; }
  .msg.user .msg-body{ color:#D8D5CE; }
  .file-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-family:var(--mono); font-size:11px; background:var(--panel-2);
    border:1px solid var(--border); padding:3px 8px; border-radius:5px; margin:3px 4px 0 0;
    cursor:pointer; color:var(--amber);
  }
  .file-chip:hover{ border-color:var(--amber); }
  .thinking{ display:flex; gap:5px; padding:4px 0; align-items:center; }
  .thinking span{
    width:5px; height:5px; border-radius:50%; background:var(--text-faint);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2){ animation-delay:.15s; }
  .thinking span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,80%,100%{ transform:scale(0.6); opacity:.4; } 40%{ transform:scale(1); opacity:1; } }
  .thinking-label{ font-family:var(--mono); font-size:11px; color:var(--text-faint); margin-left:2px; }

  .composer{
    border-top:1px solid var(--border); padding:10px; background:var(--panel); flex-shrink:0;
  }
  .composer-box{
    display:flex; align-items:flex-end; gap:8px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:8px 8px 8px 12px;
  }
  .composer-box:focus-within{ border-color:var(--amber); }
  textarea#input{
    flex:1; background:transparent; border:none; outline:none; resize:none;
    color:var(--text); font-family:var(--sans); font-size:13.5px; line-height:1.4;
    max-height:140px; padding:4px 0;
  }
  textarea#input::placeholder{ color:var(--text-faint); }
  .send-btn{
    width:30px; height:30px; border-radius:7px; border:none; background:var(--amber);
    color:#1A1408; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition:.12s;
  }
  .send-btn:hover{ background:#EBB271; }
  .send-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .send-btn svg{ width:15px; height:15px; }
  .hint{ font-size:10.5px; color:var(--text-faint); margin-top:6px; font-family:var(--mono); padding-left:2px; }

  /* status bar */
  .statusbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 16px; border-top:1px solid var(--border); background:var(--panel);
    font-family:var(--mono); font-size:11px; color:var(--text-faint); flex-shrink:0;
  }
  .statusbar .stat{ color:var(--text-dim); }
  .statusbar .stat b{ color:var(--amber); font-weight:600; }
  .status-dot{ width:6px; height:6px; border-radius:50%; background:var(--green); display:inline-block; margin-right:5px; }

  @media (max-width: 780px){
    .layout{ flex-direction:column; }
    .chat-pane{ width:100%; max-width:none; height:46%; border-right:none; border-bottom:1px solid var(--border); }
    .code-pane{ height:54%; }
    .file-tree{ width:130px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">&gt;_</div>
    <div>
      <h1>Forge</h1>
    </div>
    <span class="sub">/</span>
    <input id="projName" class="proj-name" value="my-project" spellcheck="false">
  </div>
  <div class="topbar-right">
    <button class="btn ghost" id="clearBtn" title="Clear everything">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
      New
    </button>
    <button class="btn primary" id="exportBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      Export .zip
    </button>
  </div>
</div>

<div class="layout">
  <div class="chat-pane">
    <div class="chat-scroll" id="chatScroll"></div>
    <div class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Ask Claude to build something..."></textarea>
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </div>

  <div class="code-pane">
    <div class="file-tree" id="fileTree">
      <div class="file-tree-empty">No files yet. Ask Claude to create something and files will appear here as they're generated.</div>
    </div>
    <div class="viewer">
      <div class="viewer-tabs" id="viewerTabs"></div>
      <div id="viewerBody" style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <div class="viewer-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
          <div>Generated files will render here</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="statusbar">
  <div><span class="status-dot"></span><span id="statusText">Ready</span></div>
  <div class="stat"><b id="fileCount">0</b> files &nbsp;·&nbsp; <b id="lineCount">0</b> lines &nbsp;·&nbsp; <b id="byteCount">0 B</b></div>
</div>

<script>
hljs.configure({ ignoreUnescapedHTML: true });

const state = {
  files: {},        // path -> content
  order: [],         // insertion order of paths
  openTabs: [],
  activeFile: null,
  conversation: [],  // {role, content} raw for API
  busy: false,
  newlyAdded: new Set()
};

const chatScroll = document.getElementById('chatScroll');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const fileTree = document.getElementById('fileTree');
const viewerTabs = document.getElementById('viewerTabs');
const viewerBody = document.getElementById('viewerBody');
const exportBtn = document.getElementById('exportBtn');
const clearBtn = document.getElementById('clearBtn');
const statusText = document.getElementById('statusText');
const fileCountEl = document.getElementById('fileCount');
const lineCountEl = document.getElementById('lineCount');
const byteCountEl = document.getElementById('byteCount');

const SYSTEM_PROMPT = `You are a senior software engineer working inside a code-generation app called Forge. The user chats with you to build a small project (web app, script, tool, etc).

RULES FOR OUTPUT:
1. Whenever you create or update a file, output its FULL contents wrapped exactly like this:
<file path="relative/path/filename.ext">
...complete file contents...
</file>
2. You may output multiple <file> blocks in one response.
3. Always output the COMPLETE file contents inside each <file> block, never partial diffs or "// rest unchanged" placeholders.
4. Outside of <file> blocks, write brief, plain conversational text (1-4 sentences) explaining what you did or asking a clarifying question if needed. Do not restate the file list in prose since the app already displays it.
5. Prefer plain, dependency-light HTML/CSS/JS unless the user asks for a specific framework or language.
6. Keep responses focused — build incrementally based on the conversation rather than regenerating unrelated files.
7. Never wrap <file> blocks in markdown code fences. Use the raw <file> tag format only.`;

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addMessage(role, html, isThinking=false){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'user' ? 'YOU' : 'AI';
  const body = document.createElement('div');
  body.className = 'msg-body';
  body.innerHTML = html;
  wrap.appendChild(avatar);
  wrap.appendChild(body);
  chatScroll.appendChild(wrap);
  chatScroll.scrollTop = chatScroll.scrollHeight;
  return body;
}

function mdLite(text){
  // minimal formatting: paragraphs + inline code
  return text.split(/\n\n+/).map(p => {
    let t = escapeHtml(p.trim());
    t = t.replace(/`([^`]+)`/g, '<code style="background:#2A2E35;padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px;">$1</code>');
    return '<p>' + t.replace(/\n/g,'<br>') + '</p>';
  }).join('');
}

function langFromPath(path){
  const ext = path.split('.').pop().toLowerCase();
  const map = { js:'javascript', jsx:'javascript', ts:'typescript', tsx:'typescript', py:'python', html:'xml', htm:'xml', css:'css', json:'json', md:'markdown', sh:'bash', yml:'yaml', yaml:'yaml', java:'java', c:'c', cpp:'cpp', go:'go', rb:'ruby', rs:'rust', sql:'sql', xml:'xml', php:'php' };
  return map[ext] || 'plaintext';
}

function parseFileBlocks(text){
  const files = [];
  const re = /<file path="([^"]+)">\n?([\s\S]*?)\n?<\/file>/g;
  let m;
  while((m = re.exec(text)) !== null){
    files.push({ path: m[1].trim(), content: m[2] });
  }
  const remainder = text.replace(re, '').trim();
  return { files, remainder };
}

function updateStatus(text){ statusText.textContent = text; }

function updateStats(){
  const paths = Object.keys(state.files);
  fileCountEl.textContent = paths.length;
  let lines = 0, bytes = 0;
  paths.forEach(p => {
    lines += state.files[p].split('\n').length;
    bytes += new Blob([state.files[p]]).size;
  });
  lineCountEl.textContent = lines;
  byteCountEl.textContent = bytes < 1024 ? bytes + ' B' : (bytes/1024).toFixed(1) + ' KB';
  exportBtn.disabled = paths.length === 0;
}

function buildTree(paths){
  const root = {};
  paths.forEach(p => {
    const parts = p.split('/');
    let node = root;
    parts.forEach((part, i) => {
      if(i === parts.length - 1){
        node.__files = node.__files || [];
        node.__files.push(p);
      } else {
        node[part] = node[part] || {};
        node = node[part];
      }
    });
  });
  return root;
}

function renderTreeNode(node, container, depth){
  Object.keys(node).filter(k => k !== '__files').sort().forEach(dir => {
    const dirEl = document.createElement('div');
    dirEl.className = 'tree-dir';
    dirEl.style.paddingLeft = (8 + depth*12) + 'px';
    dirEl.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg> ${dir}`;
    container.appendChild(dirEl);
    renderTreeNode(node[dir], container, depth+1);
  });
  (node.__files || []).sort().forEach(path => {
    const name = path.split('/').pop();
    const fileEl = document.createElement('div');
    fileEl.className = 'tree-file' + (path === state.activeFile ? ' active' : '') + (state.newlyAdded.has(path) ? ' new' : '');
    fileEl.style.paddingLeft = (8 + depth*12) + 'px';
    fileEl.innerHTML = `<span class="dot"></span><span>${escapeHtml(name)}</span>`;
    fileEl.title = path;
    fileEl.onclick = () => openFile(path);
    container.appendChild(fileEl);
  });
}

function renderFileTree(){
  fileTree.innerHTML = '';
  const paths = Object.keys(state.files);
  if(paths.length === 0){
    fileTree.innerHTML = '<div class="file-tree-empty">No files yet. Ask Claude to create something and files will appear here as they are generated.</div>';
    return;
  }
  const tree = buildTree(paths);
  renderTreeNode(tree, fileTree, 0);
}

function openFile(path){
  state.activeFile = path;
  if(!state.openTabs.includes(path)) state.openTabs.push(path);
  renderFileTree();
  renderTabs();
  renderViewer();
}

function closeTab(path, e){
  if(e) e.stopPropagation();
  state.openTabs = state.openTabs.filter(p => p !== path);
  if(state.activeFile === path){
    state.activeFile = state.openTabs.length ? state.openTabs[state.openTabs.length-1] : null;
  }
  renderFileTree();
  renderTabs();
  renderViewer();
}

function renderTabs(){
  viewerTabs.innerHTML = '';
  state.openTabs.forEach(path => {
    const tab = document.createElement('div');
    const name = path.split('/').pop();
    tab.style.cssText = `display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;font-family:var(--mono);font-size:12px;cursor:pointer;white-space:nowrap;border-right:1px solid var(--border);color:${path===state.activeFile?'var(--amber)':'var(--text-dim)'};background:${path===state.activeFile?'var(--bg)':'transparent'};`;
    tab.innerHTML = `<span>${escapeHtml(name)}</span><span style="opacity:.5;padding:0 2px;">&times;</span>`;
    tab.onclick = () => openFile(path);
    tab.querySelector('span:last-child').onclick = (e) => closeTab(path, e);
    viewerTabs.appendChild(tab);
  });
}

function renderViewer(){
  if(!state.activeFile){
    viewerBody.innerHTML = `<div class="viewer-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg><div>Select a file to view it</div></div>`;
    return;
  }
  const path = state.activeFile;
  const content = state.files[path];
  const lang = langFromPath(path);
  viewerBody.innerHTML = `
    <div class="filepath-bar">
      <span>${escapeHtml(path)}</span>
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>
    <div class="code-scroll"><pre><code class="language-${lang}"></code></pre></div>
  `;
  const codeEl = viewerBody.querySelector('code');
  codeEl.textContent = content;
  hljs.highlightElement(codeEl);
  viewerBody.querySelector('#copyBtn').onclick = () => {
    navigator.clipboard.writeText(content);
    const b = viewerBody.querySelector('#copyBtn');
    b.textContent = 'Copied';
    setTimeout(() => b.textContent = 'Copy', 1200);
  };
}

function addOrUpdateFile(path, content, autoOpen){
  const isNew = !(path in state.files);
  state.files[path] = content;
  if(isNew){
    state.newlyAdded.add(path);
    setTimeout(() => { state.newlyAdded.delete(path); renderFileTree(); }, 1700);
  }
  if(autoOpen) openFile(path);
  renderFileTree();
  updateStats();
}

async function callClaude(){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 8000,
      system: SYSTEM_PROMPT,
      messages: state.conversation
    })
  });
  if(!res.ok){
    throw new Error('API error ' + res.status);
  }
  const data = await res.json();
  const text = (data.content || []).map(b => b.type === 'text' ? b.text : '').join('\n');
  return text;
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text || state.busy) return;
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', mdLite(text));
  state.conversation.push({ role: 'user', content: text });

  state.busy = true;
  sendBtn.disabled = true;
  updateStatus('Claude is working...');
  const thinkingBody = addMessage('assistant', `<div class="thinking"><span></span><span></span><span></span><span class="thinking-label">writing code</span></div>`);

  try {
    const raw = await callClaude();
    state.conversation.push({ role: 'assistant', content: raw });
    const { files, remainder } = parseFileBlocks(raw);

    let firstNewPath = null;
    files.forEach((f, i) => {
      addOrUpdateFile(f.path, f.content, false);
      if(i === 0) firstNewPath = f.path;
    });
    if(firstNewPath) openFile(firstNewPath);

    let html = remainder ? mdLite(remainder) : '';
    if(files.length){
      html += '<div>' + files.map(f => `<span class="file-chip" data-path="${escapeHtml(f.path)}">${fileIcon()} ${escapeHtml(f.path)}</span>`).join('') + '</div>';
    }
    if(!html) html = '<p style="color:var(--text-faint)">Done.</p>';
    thinkingBody.innerHTML = html;
    thinkingBody.querySelectorAll('.file-chip').forEach(chip => {
      chip.onclick = () => openFile(chip.dataset.path);
    });
    updateStatus('Ready');
  } catch(err){
    thinkingBody.innerHTML = `<p style="color:var(--red)">Something went wrong: ${escapeHtml(err.message)}. Try again.</p>`;
    updateStatus('Error');
  }
  state.busy = false;
  sendBtn.disabled = false;
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function fileIcon(){
  return `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-1px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`;
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

exportBtn.addEventListener('click', async () => {
  const zip = new JSZip();
  Object.keys(state.files).forEach(path => zip.file(path, state.files[path]));
  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const projName = document.getElementById('projName').value.trim() || 'project';
  a.href = url;
  a.download = projName.replace(/[^a-z0-9-_]/gi,'-') + '.zip';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

clearBtn.addEventListener('click', () => {
  if(!confirm('Start a new project? This clears the chat and all generated files.')) return;
  state.files = {}; state.order = []; state.openTabs = []; state.activeFile = null; state.conversation = [];
  chatScroll.innerHTML = '';
  renderFileTree(); renderTabs(); renderViewer(); updateStats();
  addMessage('assistant', mdLite("Fresh start. What do you want to build?"));
});

// welcome message
addMessage('assistant', mdLite("Hey — tell me what you'd like to build and I'll write the code. Files show up on the right as I create them, and you can export the whole project as a zip whenever you're ready."));
updateStats();
</script>

</body>
</html>
